<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Fresher Q&A</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3e;
    --accent: #7c6af7;
    --accent2: #f7c06a;
    --accent3: #6af7c0;
    --text: #e8e8f0;
    --muted: #7070a0;
    --code-bg: #0d0d18;
    --tag-with: #1a2e1a;
    --tag-without: #2e1a1a;
    --tag-with-color: #6af7a0;
    --tag-without-color: #f7826a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(124,106,247,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(106,247,192,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(247,192,106,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 60px;
    animation: fadeDown 0.8s ease both;
  }

  .badge {
    display: inline-block;
    background: rgba(124,106,247,0.15);
    border: 1px solid rgba(124,106,247,0.3);
    color: var(--accent);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--muted);
    font-size: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 50px;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .stat span {
    color: var(--accent2);
    font-weight: 500;
  }

  /* Filter tabs */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .filter-btn {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Search */
  .search-wrap {
    margin-bottom: 36px;
    position: relative;
    animation: fadeUp 0.8s 0.35s ease both;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 14px 18px 14px 46px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
  }

  /* Q&A Cards */
  .qa-list { display: flex; flex-direction: column; gap: 16px; }

  .qa-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.2s;
    animation: fadeUp 0.5s ease both;
  }

  .qa-card:hover { border-color: rgba(124,106,247,0.4); transform: translateY(-1px); }

  .qa-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 20px 24px;
    cursor: pointer;
    user-select: none;
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(124,106,247,0.1);
    border: 1px solid rgba(124,106,247,0.2);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    margin-top: 2px;
    min-width: 36px;
    text-align: center;
  }

  .q-text {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
  }

  .q-toggle {
    color: var(--muted);
    font-size: 20px;
    transition: transform 0.3s;
    min-width: 20px;
    text-align: center;
    line-height: 1.5;
  }

  .qa-card.open .q-toggle { transform: rotate(45deg); color: var(--accent); }

  .qa-body {
    display: none;
    padding: 0 24px 24px;
    border-top: 1px solid var(--border);
    margin-top: 0;
  }

  .qa-card.open .qa-body { display: block; }

  /* Category chips */
  .category-chips {
    display: flex;
    gap: 8px;
    margin: 16px 0 20px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: 500;
  }

  .chip.topic {
    background: rgba(124,106,247,0.1);
    color: var(--accent);
    border: 1px solid rgba(124,106,247,0.25);
  }

  .chip.with-method {
    background: var(--tag-with);
    color: var(--tag-with-color);
    border: 1px solid rgba(106,247,160,0.2);
  }

  .chip.without-method {
    background: var(--tag-without);
    color: var(--tag-without-color);
    border: 1px solid rgba(247,130,106,0.2);
  }

  /* Answer sections */
  .answer-block {
    margin-bottom: 20px;
  }

  .answer-block:last-child { margin-bottom: 0; }

  .answer-label {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .answer-label.with { color: var(--tag-with-color); }
  .answer-label.without { color: var(--tag-without-color); }
  .answer-label.concept { color: var(--accent2); }

  .answer-label::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .explanation {
    color: #b0b0c8;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
  }

  /* Code blocks */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    overflow-x: auto;
    margin-bottom: 14px;
    position: relative;
  }

  code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #c8d3f5;
  }

  .copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(124,106,247,0.15);
    border: 1px solid rgba(124,106,247,0.3);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .copy-btn:hover { background: rgba(124,106,247,0.3); }
  .copy-btn.copied { color: var(--tag-with-color); border-color: rgba(106,247,160,0.3); }

  /* Syntax highlighting */
  .kw { color: #c792ea; }
  .str { color: #c3e88d; }
  .num { color: #f78c6c; }
  .fn { color: #82aaff; }
  .cmt { color: #546e7a; font-style: italic; }
  .op { color: #89ddff; }
  .cls { color: var(--accent2); }

  /* Divider between with/without */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Output */
  .output-block {
    background: rgba(106,247,192,0.05);
    border: 1px solid rgba(106,247,192,0.15);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent3);
    margin-top: -10px;
    margin-bottom: 14px;
  }

  .output-label {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    display: none;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .qa-card { animation-fill-mode: both; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  @media (max-width: 600px) {
    .qa-header { padding: 16px; }
    .qa-body { padding: 0 16px 16px; }
    pre { padding: 14px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">// interview prep</div>
    <h1>JavaScript<br>Fresher Q&A</h1>
    <p>with & without built-in methods</p>
  </header>

  <div class="stats-bar">
    <div class="stat">Questions: <span id="total-count">0</span></div>
    <div class="stat">Shown: <span id="shown-count">0</span></div>
    <div class="stat">Difficulty: <span>Fresher</span></div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search questions...">
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Arrays">Arrays</button>
    <button class="filter-btn" data-filter="Strings">Strings</button>
    <button class="filter-btn" data-filter="Numbers">Numbers</button>
    <button class="filter-btn" data-filter="Objects">Objects</button>
    <button class="filter-btn" data-filter="Logic">Logic</button>
    <button class="filter-btn" data-filter="Functions">Functions</button>
  </div>

  <div class="qa-list" id="qa-list"></div>
  <div class="no-results" id="no-results">No questions match your search.</div>

</div>

<script>
const questions = [
  {
    q: "Reverse a string",
    topic: "Strings",
    concept: "Strings are arrays of characters. You can either use built-in methods or iterate manually.",
    withMethod: {
      label: "Using .split(), .reverse(), .join()",
      code: `<span class="kw">function</span> <span class="fn">reverseString</span>(str) {
  <span class="kw">return</span> str.<span class="fn">split</span>(<span class="str">''</span>).<span class="fn">reverse</span>().<span class="fn">join</span>(<span class="str">''</span>);
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">reverseString</span>(<span class="str">"hello"</span>)); <span class="cmt">// "olleh"</span>`,
      output: '"olleh"'
    },
    withoutMethod: {
      label: "Using a for loop",
      code: `<span class="kw">function</span> <span class="fn">reverseString</span>(str) {
  <span class="kw">let</span> result = <span class="str">""</span>;
  <span class="kw">for</span> (<span class="kw">let</span> i = str.length - <span class="num">1</span>; i >= <span class="num">0</span>; i--) {
    result += str[i];
  }
  <span class="kw">return</span> result;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">reverseString</span>(<span class="str">"hello"</span>)); <span class="cmt">// "olleh"</span>`,
      output: '"olleh"'
    }
  },
  {
    q: "Check if a string is a palindrome",
    topic: "Strings",
    concept: "A palindrome reads the same forwards and backwards. Compare original to reversed.",
    withMethod: {
      label: "Using .split(), .reverse(), .join()",
      code: `<span class="kw">function</span> <span class="fn">isPalindrome</span>(str) {
  <span class="kw">const</span> reversed = str.<span class="fn">split</span>(<span class="str">''</span>).<span class="fn">reverse</span>().<span class="fn">join</span>(<span class="str">''</span>);
  <span class="kw">return</span> str === reversed;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isPalindrome</span>(<span class="str">"racecar"</span>)); <span class="cmt">// true</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isPalindrome</span>(<span class="str">"hello"</span>));   <span class="cmt">// false</span>`,
      output: 'true, false'
    },
    withoutMethod: {
      label: "Using two-pointer approach",
      code: `<span class="kw">function</span> <span class="fn">isPalindrome</span>(str) {
  <span class="kw">let</span> left = <span class="num">0</span>, right = str.length - <span class="num">1</span>;
  <span class="kw">while</span> (left < right) {
    <span class="kw">if</span> (str[left] !== str[right]) <span class="kw">return false</span>;
    left++;
    right--;
  }
  <span class="kw">return true</span>;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isPalindrome</span>(<span class="str">"racecar"</span>)); <span class="cmt">// true</span>`,
      output: 'true'
    }
  },
  {
    q: "Find the largest number in an array",
    topic: "Arrays",
    concept: "Iterate through the array and track the maximum value encountered.",
    withMethod: {
      label: "Using Math.max() and spread operator",
      code: `<span class="kw">function</span> <span class="fn">findMax</span>(arr) {
  <span class="kw">return</span> <span class="cls">Math</span>.<span class="fn">max</span>(...arr);
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">findMax</span>([<span class="num">3</span>, <span class="num">1</span>, <span class="num">9</span>, <span class="num">4</span>, <span class="num">5</span>])); <span class="cmt">// 9</span>`,
      output: '9'
    },
    withoutMethod: {
      label: "Using a for loop",
      code: `<span class="kw">function</span> <span class="fn">findMax</span>(arr) {
  <span class="kw">let</span> max = arr[<span class="num">0</span>];
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">1</span>; i < arr.length; i++) {
    <span class="kw">if</span> (arr[i] > max) max = arr[i];
  }
  <span class="kw">return</span> max;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">findMax</span>([<span class="num">3</span>, <span class="num">1</span>, <span class="num">9</span>, <span class="num">4</span>, <span class="num">5</span>])); <span class="cmt">// 9</span>`,
      output: '9'
    }
  },
  {
    q: "Count occurrences of each character in a string",
    topic: "Strings",
    concept: "Use an object as a frequency map — each character is a key, its count is the value.",
    withMethod: {
      label: "Using reduce()",
      code: `<span class="kw">function</span> <span class="fn">charCount</span>(str) {
  <span class="kw">return</span> [...str].<span class="fn">reduce</span>((acc, char) => {
    acc[char] = (acc[char] || <span class="num">0</span>) + <span class="num">1</span>;
    <span class="kw">return</span> acc;
  }, {});
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">charCount</span>(<span class="str">"hello"</span>));`,
      output: '{ h: 1, e: 1, l: 2, o: 1 }'
    },
    withoutMethod: {
      label: "Using a for loop and plain object",
      code: `<span class="kw">function</span> <span class="fn">charCount</span>(str) {
  <span class="kw">const</span> map = {};
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < str.length; i++) {
    <span class="kw">const</span> ch = str[i];
    map[ch] = map[ch] ? map[ch] + <span class="num">1</span> : <span class="num">1</span>;
  }
  <span class="kw">return</span> map;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">charCount</span>(<span class="str">"hello"</span>));`,
      output: '{ h: 1, e: 1, l: 2, o: 1 }'
    }
  },
  {
    q: "Remove duplicates from an array",
    topic: "Arrays",
    concept: "Duplicates can be removed using Set (unique values only) or by checking if a value already exists.",
    withMethod: {
      label: "Using Set",
      code: `<span class="kw">function</span> <span class="fn">removeDuplicates</span>(arr) {
  <span class="kw">return</span> [...<span class="kw">new</span> <span class="cls">Set</span>(arr)];
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">removeDuplicates</span>([<span class="num">1</span>, <span class="num">2</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">3</span>, <span class="num">4</span>]));`,
      output: '[1, 2, 3, 4]'
    },
    withoutMethod: {
      label: "Using indexOf check",
      code: `<span class="kw">function</span> <span class="fn">removeDuplicates</span>(arr) {
  <span class="kw">const</span> result = [];
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < arr.length; i++) {
    <span class="kw">if</span> (result.indexOf(arr[i]) === -<span class="num">1</span>) {
      result.<span class="fn">push</span>(arr[i]);
    }
  }
  <span class="kw">return</span> result;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">removeDuplicates</span>([<span class="num">1</span>, <span class="num">2</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">3</span>, <span class="num">4</span>]));`,
      output: '[1, 2, 3, 4]'
    }
  },
  {
    q: "Check if a number is prime",
    topic: "Numbers",
    concept: "A prime number is divisible only by 1 and itself. Check divisibility up to its square root for efficiency.",
    withMethod: {
      label: "Using Array.from() and .every()",
      code: `<span class="kw">function</span> <span class="fn">isPrime</span>(n) {
  <span class="kw">if</span> (n < <span class="num">2</span>) <span class="kw">return false</span>;
  <span class="kw">return</span> <span class="cls">Array</span>.<span class="fn">from</span>({length: n - <span class="num">2</span>}, (_, i) => i + <span class="num">2</span>)
    .<span class="fn">every</span>(i => n % i !== <span class="num">0</span>);
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isPrime</span>(<span class="num">7</span>));  <span class="cmt">// true</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isPrime</span>(<span class="num">10</span>)); <span class="cmt">// false</span>`,
      output: 'true, false'
    },
    withoutMethod: {
      label: "Using a for loop (optimized with sqrt)",
      code: `<span class="kw">function</span> <span class="fn">isPrime</span>(n) {
  <span class="kw">if</span> (n < <span class="num">2</span>) <span class="kw">return false</span>;
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">2</span>; i <= <span class="cls">Math</span>.<span class="fn">sqrt</span>(n); i++) {
    <span class="kw">if</span> (n % i === <span class="num">0</span>) <span class="kw">return false</span>;
  }
  <span class="kw">return true</span>;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isPrime</span>(<span class="num">7</span>));  <span class="cmt">// true</span>`,
      output: 'true'
    }
  },
  {
    q: "Flatten a nested array",
    topic: "Arrays",
    concept: "Flattening means converting [[1,[2]],3] into [1,2,3]. Recursion or flat() can handle multiple levels.",

<span class="fn">console</span>.<span class="fn">log</span>(doubled);`,
      output: '[2, 4, 6, 8]'
    }
  },
  {
    q: "Sort an array of objects by a property",
    topic: "Objects",
    concept: "Use a comparator function to tell sort() how to compare objects by a specific key.",
    withMethod: {
      label: "Using Array.sort() with comparator",
      code: `<span class="kw">const</span> people = [
  { name: <span class="str">"Alice"</span>, age: <span class="num">30</span> },
  { name: <span class="str">"Bob"</span>, age: <span class="num">25</span> },
  { name: <span class="str">"Carol"</span>, age: <span class="num">35</span> }
];

<span class="kw">const</span> sorted = people.<span class="fn">sort</span>((a, b) => a.age - b.age);
<span class="fn">console</span>.<span class="fn">log</span>(sorted.<span class="fn">map</span>(p => p.name));`,
      output: '["Bob", "Alice", "Carol"]'
    },
    withoutMethod: {
      label: "Using bubble sort on objects",
      code: `<span class="kw">function</span> <span class="fn">sortByAge</span>(arr) {
  <span class="kw">const</span> a = [...arr];
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < a.length; i++) {
    <span class="kw">for</span> (<span class="kw">let</span> j = <span class="num">0</span>; j < a.length - i - <span class="num">1</span>; j++) {
      <span class="kw">if</span> (a[j].age > a[j+<span class="num">1</span>].age) {
        [a[j], a[j+<span class="num">1</span>]] = [a[j+<span class="num">1</span>], a[j]];
      }
    }
  }
  <span class="kw">return</span> a;
}`,
      output: '["Bob", "Alice", "Carol"]'
    }
  },
  {
    q: "Check if a value is a number (not NaN)",
    topic: "Logic",
    concept: "NaN is the only value in JS not equal to itself. Use isNaN() or the identity trick.",
    withMethod: {
      label: "Using Number.isFinite() and isNaN()",
      code: `<span class="kw">function</span> <span class="fn">isValidNumber</span>(val) {
  <span class="kw">return</span> <span class="kw">typeof</span> val === <span class="str">'number'</span> && !<span class="fn">isNaN</span>(val);
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isValidNumber</span>(<span class="num">42</span>));    <span class="cmt">// true</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isValidNumber</span>(<span class="cls">NaN</span>));   <span class="cmt">// false</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isValidNumber</span>(<span class="str">"42"</span>));  <span class="cmt">// false</span>`,
      output: 'true, false, false'
    },
    withoutMethod: {
      label: "Using NaN self-inequality trick",
      code: `<span class="kw">function</span> <span class="fn">isValidNumber</span>(val) {
  <span class="cmt">// NaN is the ONLY value not equal to itself</span>
  <span class="kw">return</span> <span class="kw">typeof</span> val === <span class="str">'number'</span> && val === val;
}

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isValidNumber</span>(<span class="num">42</span>));   <span class="cmt">// true</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isValidNumber</span>(<span class="cls">NaN</span>));  <span class="cmt">// false</span>`,
      output: 'true, false'
    }
  }
];

// Render
function renderQuestions(filtered) {
  const list = document.getElementById('qa-list');
  const noRes = document.getElementById('no-results');
  list.innerHTML = '';

  if (filtered.length === 0) {
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = 0;
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = filtered.length;

  filtered.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'qa-card';
    card.style.animationDelay = `${idx * 0.04}s`;
    card.innerHTML = `
      <div class="qa-header" onclick="toggle(this)">
        <div class="q-num">Q${String(idx+1).padStart(2,'0')}</div>
        <div class="q-text">${item.q}</div>
        <div class="q-toggle">+</div>
      </div>
      <div class="qa-body">
        <div class="category-chips">
          <span class="chip topic">${item.topic}</span>
          <span class="chip with-method">✓ With Method</span>
          <span class="chip without-method">✗ Without Method</span>
        </div>
        <div class="answer-block">
          <div class="answer-label concept">Concept</div>
          <div class="explanation">${item.concept}</div>
        </div>
        <div class="divider"><span>with built-in method</span></div>
        <div class="answer-block">
          <div class="answer-label with">${item.withMethod.label}</div>
          <pre><button class="copy-btn" onclick="copyCode(this)">COPY</button><code>${item.withMethod.code}</code></pre>
          <div class="output-block"><div class="output-label">OUTPUT</div>${item.withMethod.output}</div>
        </div>
        <div class="divider"><span>without built-in method</span></div>
        <div class="answer-block">
          <div class="answer-label without">${item.withoutMethod.label}</div>
          <pre><button class="copy-btn" onclick="copyCode(this)">COPY</button><code>${item.withoutMethod.code}</code></pre>
          <div class="output-block"><div class="output-label">OUTPUT</div>${item.withoutMethod.output}</div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function toggle(header) {
  const card = header.parentElement;
  card.classList.toggle('open');
}

function copyCode(btn) {
  const code = btn.nextElementSibling.innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'COPIED!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 2000);
  });
}

// Filter & search
let currentFilter = 'all';

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('search').addEventListener('input', applyFilters);

function applyFilters() {
  const query = document.getElementById('search').value.toLowerCase();
  const filtered = questions.filter(q => {
    const matchTopic = currentFilter === 'all' || q.topic === currentFilter;
    const matchSearch = q.q.toLowerCase().includes(query) || q.topic.toLowerCase().includes(query);
    return matchTopic && matchSearch;
  });
  renderQuestions(filtered);
}

document.getElementById('total-count').textContent = questions.length;
renderQuestions(questions);
document.getElementById('shown-count').textContent = questions.length;
</script>
