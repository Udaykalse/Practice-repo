<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event</title>
  </head>
  <body>
    <button id="btnPlus">Plus</button>
    <p id="count">0</p>

    <script>
      let button = document.getElementById("btnPlus");
      let count = document.getElementById("count");
      button.addEventListener("click", function () {
        let num = Number(count.innerText);
        count1 = num + 1;
        count.innerText = count1;
        return count;
      });
    </script>
  </body>
</html>
