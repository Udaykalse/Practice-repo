<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Class (Dark Mode / Active)</title>
    <style>
      .dark {
        background: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <button id="btn">Dark</button>
    <h1>Hello World</h1>
    <script>
      const modBtn = document.getElementById("btn");
      modBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
      });
    </script>
  </body>
</html>
