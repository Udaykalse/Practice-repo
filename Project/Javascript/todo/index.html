<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple To-Do List</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        .input-group { display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button#add-btn { padding: 8px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #eee; margin-bottom: 5px; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .delete-btn { background: #ff4444; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>My Tasks</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="add-btn">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        const input = document.getElementById('taskInput');
        const addButton = document.getElementById('add-btn');
        const taskList = document.getElementById('taskList');

        function addTask() {
            const taskValue = input.value;

            if (taskValue.trim() === "") {
                alert("Please enter a task!");
                return;
            }

            const listItem = document.createElement('li');
            listItem.innerText = taskValue;

            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = "X";
            deleteBtn.className = "delete-btn";
            
            deleteBtn.onclick = function() {
                taskList.removeChild(listItem);
            };

            listItem.appendChild(deleteBtn);
            taskList.appendChild(listItem);

            input.value = "";
        }

        addButton.addEventListener('click', addTask);

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>

</body>
</html>
