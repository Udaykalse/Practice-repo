<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sound Board</title>
  </head>
  <body>
    <div class="wrapper">
      <h1 class="title">🎵 Sound Board</h1>
      <p class="subtitle">Tap a sound to play it</p>
      <div id="buttons"></div>
      <div id="now-playing" class="now-playing hidden">
        <span class="pulse-dot"></span>
        <span id="now-playing-text">Playing: —</span>
      </div>
    </div>
    <audio src="sounds/applause.mp3" id="applause"></audio>
    <audio src="sounds/boo.mp3" id="boo"></audio>
    <audio src="sounds/gasp.mp3" id="gasp"></audio>
    <audio src="sounds/tada.mp3" id="tada"></audio>
    <audio src="sounds/victory.mp3" id="victory"></audio>
    <audio src="sounds/wrong.mp3" id="wrong"></audio>
    <script src="script.js"></script>
  </body>
</html>
