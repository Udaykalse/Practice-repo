<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Random Choice Picker - Make decisions easily with animated random selection">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>ChoiceMaster | Random Decision Maker</title>
</head>
<body>
    <div class="theme-toggle-container">
        <button class="theme-btn" id="themeToggle" aria-label="Toggle dark/light mode">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun" style="display: none;"></i>
        </button>
    </div>

    <div class="main-container">
        <div class="hero-section">
            <div class="icon-badge">
                <i class="fas fa-dice-d6"></i>
            </div>
            <h1>Choice<span class="gradient-text">Master</span></h1>
            <p class="subtitle">Let fate decide — add your options and watch the magic happen</p>
        </div>

        <div class="input-card">
            <div class="card-header">
                <label for="textarea">
                    <i class="fas fa-pencil-alt"></i> Enter your choices
                </label>
                <span class="input-hint">Separate each option with a comma <strong>,</strong></span>
            </div>
            <textarea 
                id="textarea" 
                placeholder="e.g., Pizza, Sushi, Pasta, Salad, Burger" 
                rows="4"
            ></textarea>
            <div class="input-actions">
                <button class="btn-secondary" id="clearBtn">
                    <i class="fas fa-trash-alt"></i> Clear All
                </button>
                <div class="shortcut-hint">
                    <i class="fas fa-keyboard"></i> Press <kbd>Enter</kbd> to pick
                </div>
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <i class="fas fa-tags"></i>
                <span id="choiceCount">0</span>
                <span>choices</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-chart-line"></i>
                <span id="statusText">Ready</span>
            </div>
        </div>

        <div class="tags-wrapper">
            <div id="tags" class="tags-container"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-inbox"></i>
                <p>No choices yet. Add some options above!</p>
            </div>
        </div>

        <div class="action-footer">
            <button class="btn-primary" id="pickBtn" disabled>
                <i class="fas fa-random"></i> Pick Random Choice
            </button>
        </div>

        <div class="toast-message" id="toastMessage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
