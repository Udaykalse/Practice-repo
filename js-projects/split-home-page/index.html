<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Split Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <section class="split left">
        <div class="overlay"></div>

        <div class="content">
          <h1>Naruto Uzumaki</h1>

          <p>
            The future Hokage of the Hidden Leaf Village with endless
            determination and powerful ninja skills.
          </p>

          <a href="#" class="btn">Explore</a>
        </div>
      </section>

      <section class="split right">
        <div class="overlay"></div>

        <div class="content">
          <h1>Satoru Gojo</h1>

          <p>
            The strongest sorcerer from Jujutsu Kaisen known for his limitless
            cursed energy and iconic style.
          </p>

          <a href="#" class="btn">Explore</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
