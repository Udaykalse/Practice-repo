<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Dad Jokes</title>
  </head>
  <body>
    <div class="container">
      <div class="badge">😂 Don't Laugh Challenge</div>
      <div id="joke" class="joke">Hit the button for your first joke...</div>
      <div class="meta">
        <span id="counter" class="counter">0 jokes survived</span>
        <span id="rating" class="rating"></span>
      </div>
      <div class="btn-row">
        <button id="laughBtn" class="btn btn-laugh">😂 I Laughed</button>
        <button id="jokeBtn" class="btn btn-next">Get a Joke</button>
      </div>
      <div id="streak" class="streak hidden">🔥 <span id="streakCount">0</span> streak!</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
