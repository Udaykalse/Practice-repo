<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Anime Expanding Cards</title>
  </head>
  <body>
    <div class="container">
      <div
        class="panel active"
        style="
          background-image: url(&quot;https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=1350&q=80&quot;);
        "
      >
        <span class="badge">Shonen</span>
        <h3>Naruto Uzumaki</h3>
      </div>
      <div
        class="panel"
        style="
          background-image: url(&quot;https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1350&q=80&quot;);
        "
      >
        <span class="badge">Dark Fantasy</span>
        <h3>Attack on Titan</h3>
      </div>
      <div
        class="panel"
        style="
          background-image: url(&quot;https://images.unsplash.com/photo-1612178537253-bccd437b730e?auto=format&fit=crop&w=1350&q=80&quot;);
        "
      >
        <span class="badge">Action</span>
        <h3>Dragon Ball Z</h3>
      </div>
      <div
        class="panel"
        style="
          background-image: url(&quot;https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNSBR1Xo0N0_SntyjJNpzvlT1DfDezXB4AMg&s&quot;);
        "
      >
        <span class="badge">Adventure</span>
        <h3>One Piece</h3>
      </div>
      <div
        class="panel"
        style="
          background-image: url(&quot;https://www.joblo.com/wp-content/uploads/2025/09/doma_infinity_castle-min-1024x538.jpg&quot;);
        "
      >
        <span class="badge">Supernatural</span>
        <h3>Demon Slayer</h3>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
