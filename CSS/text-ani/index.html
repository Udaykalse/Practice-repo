<!doctype html>
<html>
  <head>
    <title>Neon Follow Animation</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrap">
      <svg
        class="neon-svg"
        viewBox="0 0 700 220"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <symbol id="main-txt">
            <text x="350" y="115">FOLLOW</text>
          </symbol>
        </defs>
        <use href="#main-txt" class="layer-base" />
        <use href="#main-txt" class="layer-1" />
        <use href="#main-txt" class="layer-2" />
        <use href="#main-txt" class="layer-3" />
        <use href="#main-txt" class="layer-4" />
        <use href="#main-txt" class="layer-5" />
      </svg>
      <svg
        class="sub-svg"
        viewBox="0 0 700 70"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <symbol id="sub-txt">
            <text x="350" y="38">YOUR DREAMS</text>
          </symbol>
        </defs>
        <use href="#sub-txt" class="s-layer-1" />
        <use href="#sub-txt" class="s-layer-2" />
        <use href="#sub-txt" class="s-layer-3" />
      </svg>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </body>
</html>
