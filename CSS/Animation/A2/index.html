<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Crow Animation</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="scene">
        <div class="background">
            <div class="moon"></div>
            <div class="star star1"></div>
            <div class="star star2"></div>
            <div class="star star3"></div>
            <div class="star star4"></div>
            <div class="star star5"></div>
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
            <div class="tree"></div>
            <div class="tree tree2"></div>
        </div>
        
        <div class="container">
            <div class="crow-container">
                <div class="beak-upper"></div>
                <div class="beak-lower"></div>
                <div class="leg leg-1"></div>
                <div class="leg leg-2"></div>
                <div class="crow">
                    <div class="feathers">
                        <div class="feather feather1"></div>
                        <div class="feather feather2"></div>
                        <div class="feather feather3"></div>
                    </div>
                    <div class="wings">
                        <div class="wing"></div>
                    </div>
                    <div class="tail">
                        <div class="tail-feather tail-feather1"></div>
                        <div class="tail-feather tail-feather2"></div>
                        <div class="tail-feather tail-feather3"></div>
                    </div>
                    <div class="eye eye-left">
                        <div class="pupil"></div>
                        <div class="sparkle"></div>
                    </div>
                    <div class="eye eye-right">
                        <div class="pupil"></div>
                        <div class="sparkle"></div>
                    </div>
                </div>
            </div>
            
            <div class="ground"></div>
            <div class="controls">
                <button id="flyBtn" class="control-btn"><i class="fas fa-feather-alt"></i> Toggle Flying</button>
                <button id="cawBtn" class="control-btn"><i class="fas fa-volume-up"></i> Caw Animation</button>
                <button id="speedBtn" class="control-btn"><i class="fas fa-tachometer-alt"></i> Speed: Normal</button>
            </div>
            
            <div class="info-panel">
                <h1>Enhanced Crow Animation</h1>
                <p>This upgraded crow features:</p>
                <ul>
                    <li>More detailed feathers and textures</li>
                    <li>Interactive controls</li>
                    <li>Nighttime scene with moon and stars</li>
                    <li>Multiple simultaneous animations</li>
                    <li>Smoother, more realistic movements</li>
                </ul>
            </div>
        </div>
    </div>
    
    <audio id="cawSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-crow-cawing-1190.mp3" type="audio/mpeg">
    </audio>
    
    <script src="./crow.js"></script>
</body>
</html>
