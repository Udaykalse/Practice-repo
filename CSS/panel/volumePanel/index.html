<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <title>Volume Control</title>
</head>
<body>
   <div class="container">
      <div class="icon"><img alt="volume icon" id="icon"></div>
      <div class="range">
         <input type="range" min="0" max="100" value="50" name="sound" id="sound-value" oninput="updateVolume()">
      </div>
      <div class="count"><span id="no">50</span></div>
   </div>
   <script src="script.js"></script>
</body>
</html>
