<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <title>Navigation Bar</title>
</head>
<body>
   <div class="container">
      <div class="circle" id="circle"></div>
      <div class="icon">
         <div onclick="navClick(0)">
            <img id="icon0" src="icon/user.png" alt="Profile">
            <span class="label">Profile</span>
         </div>
         <div onclick="navClick(1)">
            <img id="icon1" src="icon/cart.png" alt="Cart">
            <span class="label">Cart</span>
         </div>
         <div onclick="navClick(2)">
            <img id="icon2" src="icon/home.png" alt="Home">
            <span class="label">Home</span>
         </div>
         <div onclick="navClick(3)">
            <img id="icon3" src="icon/search.png" alt="Search">
            <span class="label">Search</span>
         </div>
         <div onclick="navClick(4)">
            <img id="icon4" src="icon/cog.png" alt="Settings">
            <span class="label">Settings</span>
         </div>
      </div>
   </div>
   <script src="script.js"></script>
</body>
</html>
