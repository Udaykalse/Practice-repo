<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Stats Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="dashboard">
      <header class="dashboard-header">
        <h1 class="dashboard-title">Social Reach</h1>
        <p class="dashboard-subtitle">Live audience metrics</p>
      </header>

      <div class="cards-grid">
        <article
          class="stat-card"
          data-platform="instagram"
          data-target="128400"
        >
          <div class="card-glow"></div>
          <div class="card-inner">
            <div class="card-top">
              <div class="icon-wrap">
                <i class="fab fa-instagram"></i>
              </div>
              <span class="platform-label">Instagram</span>
            </div>
            <div class="card-body">
              <div class="counter-wrap">
                <span class="counter" aria-live="polite">0</span>
                <span class="counter-suffix">+</span>
              </div>
              <span class="metric-label">Followers</span>
            </div>
            <div class="card-footer">
              <span class="trend up"
                ><i class="fas fa-arrow-trend-up"></i> 4.2%</span
              >
              <span class="period">this month</span>
            </div>
          </div>
        </article>

        <article class="stat-card" data-platform="youtube" data-target="52300">
          <div class="card-glow"></div>
          <div class="card-inner">
            <div class="card-top">
              <div class="icon-wrap">
                <i class="fab fa-youtube"></i>
              </div>
              <span class="platform-label">YouTube</span>
            </div>
            <div class="card-body">
              <div class="counter-wrap">
                <span class="counter" aria-live="polite">0</span>
                <span class="counter-suffix">+</span>
              </div>
              <span class="metric-label">Subscribers</span>
            </div>
            <div class="card-footer">
              <span class="trend up"
                ><i class="fas fa-arrow-trend-up"></i> 6.8%</span
              >
              <span class="period">this month</span>
            </div>
          </div>
        </article>

        <article class="stat-card" data-platform="facebook" data-target="74500">
          <div class="card-glow"></div>
          <div class="card-inner">
            <div class="card-top">
              <div class="icon-wrap">
                <i class="fab fa-facebook-f"></i>
              </div>
              <span class="platform-label">Facebook</span>
            </div>
            <div class="card-body">
              <div class="counter-wrap">
                <span class="counter" aria-live="polite">0</span>
                <span class="counter-suffix">+</span>
              </div>
              <span class="metric-label">Page Fans</span>
            </div>
            <div class="card-footer">
              <span class="trend down"
                ><i class="fas fa-arrow-trend-down"></i> 1.1%</span
              >
              <span class="period">this month</span>
            </div>
          </div>
        </article>

        <article class="stat-card" data-platform="twitter" data-target="31900">
          <div class="card-glow"></div>
          <div class="card-inner">
            <div class="card-top">
              <div class="icon-wrap">
                <i class="fab fa-x-twitter"></i>
              </div>
              <span class="platform-label">X / Twitter</span>
            </div>
            <div class="card-body">
              <div class="counter-wrap">
                <span class="counter" aria-live="polite">0</span>
                <span class="counter-suffix">+</span>
              </div>
              <span class="metric-label">Followers</span>
            </div>
            <div class="card-footer">
              <span class="trend up"
                ><i class="fas fa-arrow-trend-up"></i> 2.5%</span
              >
              <span class="period">this month</span>
            </div>
          </div>
        </article>
      </div>

      <div class="total-bar">
        <span class="total-label">Total Reach</span>
        <span class="total-count" id="total-count">0</span>
        <span class="total-suffix">across all platforms</span>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
